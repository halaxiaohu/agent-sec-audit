[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sec-audit"
version = "0.4.2"
description = "Static & semantic security scanner for AI Coding Agents (AGENTS.md, SKILL.md), MCP Server configurations, and LLM tool definitions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "AgentSec Contributors" }
]
keywords = [
    "ai-security",
    "mcp",
    "model-context-protocol",
    "codex",
    "prompt-injection",
    "static-analysis",
    "sarif",
    "llm-security",
    "agents-md"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
openai = [
    "openai>=1.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
agent-sec-audit = "agent_sec_audit.cli:main"

[project.urls]
Homepage = "https://github.com/halaxiaohu/agent-sec-audit"
Documentation = "https://github.com/halaxiaohu/agent-sec-audit#readme"
Repository = "https://github.com/halaxiaohu/agent-sec-audit"
Issues = "https://github.com/halaxiaohu/agent-sec-audit/issues"
Changelog = "https://github.com/halaxiaohu/agent-sec-audit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
